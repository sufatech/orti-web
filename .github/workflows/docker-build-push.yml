name: 🌐 Build & Push Website

on:
  push:
    branches: [ main, dev ]

env:
  IMAGE_NAME: ghcr.io/sufatech/orti-website

jobs:
  build:
    name: Build Website Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set Tag
        id: vars
        run: echo "tag=1.0.$(date +%Y%m%d).${{ github.run_number }}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
          
      - name: Update GitOps
        run: |
          git clone -b main https://x-access-token:${{ secrets.GITOPS_PAT }}@github.com/sufatech/infra-gitops.git
          cd infra-gitops
          
          # yq kurulu değilse kur
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && chmod +x /usr/local/bin/yq
          
          yq -i ".image.tag = \"${{ steps.vars.outputs.tag }}\"" clusters/orti/dev/services/website.yaml
          
          git config user.name "CI Bot"
          git config user.email "ci-bot@sufatech.com"
          git add .
          git commit -m "chore: update orti-website to ${{ steps.vars.outputs.tag }}" || true
          git push origin main
